<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>洁的测试版AI助手</title>
    <style>
        body { font-family: sans-serif; max-width: 600px; margin: 50px auto; padding: 20px; }
        #chat-box { border: 1px solid #ccc; height: 300px; overflow-y: auto; padding: 10px; margin-bottom: 10px; border-radius: 8px; background: #f9f9f9;}
        .user-msg { color: blue; text-align: right; margin: 10px 0;}
        .ai-msg { color: green; text-align: left; margin: 10px 0;}
        .input-area { display: flex; gap: 10px; }
        input[type="text"] { flex: 1; padding: 10px; border-radius: 5px; border: 1px solid #ccc;}
        button { padding: 10px 20px; background: #007bff; color: white; border: none; border-radius: 5px; cursor: pointer;}
        button:disabled { background: #ccc; }
    </style>
</head>
<body>
    <!-- 1. YOLO 图像识别模块 -->
    <div style="border: 1px solid #007bff; padding: 10px; margin-bottom: 20px; border-radius: 8px;">
        <h3>📷 YOLO 图像识别</h3>
        <input type="file" id="image-input" accept="image/*">
        <button onclick="detectImage()" style="padding: 5px 10px; font-size: 14px;">上传并识别</button>

        <div style="margin-top: 10px;">
            <img id="result-img" style="max-width: 100%; display: none; border-radius: 5px;" />
            <!-- 这里用来显示识别出的文字结果 -->
            <p id="detect-labels" style="color: #007bff; font-weight: bold; margin-top: 10px;"></p>
        </div>
    </div>

    <!-- 2. 大模型聊天模块 -->
    <h2>本地大模型 Web 助手</h2>
    <div id="chat-box"></div>
    <div class="input-area">
        <input type="text" id="user-input" placeholder="输入你的问题..." onkeydown="if(event.key==='Enter') sendMessage()">
        <button id="send-btn" onclick="sendMessage()">发送</button>
    </div>

    <!-- 3. 核心脚本 -->
    <script>
        function fileToBase64(file) {
    return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = () => resolve(reader.result.split(',')[1]); // 去掉前缀
        reader.onerror = error => reject(error);
    });
}
        // --- YOLO 识别函数 ---
        async function detectImage() {
            const fileInput = document.getElementById('image-input');
            const resultImg = document.getElementById('result-img');
            const labelP = document.getElementById('detect-labels');

            if (fileInput.files.length === 0) {
                alert("请先选择一张图片！");
                return;
            }

            const formData = new FormData();
            formData.append("file", fileInput.files[0]);

            resultImg.style.display = 'block';
            resultImg.src = '';
            labelP.innerText = "识别中...";

            try {
                const response = await fetch('http://127.0.0.1:8000/api/detect', {
                    method: 'POST',
                    body: formData
                });
                const data = await response.json();

                // 显示识别后的图片
                resultImg.src = "data:image/jpeg;base64," + data.image;

                // 显示识别结果文字
                const labelText = data.labels.join(", ");
                labelP.innerText = "识别结果：" + (labelText || "未识别到已知物体");

                // 自动填入聊天框
                document.getElementById('user-input').value = `YOLO 识别到了 [${labelText}]，请华小洁帮我分析一下图片里的情况。`;

            } catch (error) {
                labelP.innerText = "";
                alert("识别失败：" + error.message);
            }
        }

        // --- 聊天函数 ---
        async function sendMessage() {
            const inputEl = document.getElementById('user-input');
            const chatBox = document.getElementById('chat-box');
            const sendBtn = document.getElementById('send-btn');
            const fileInput = document.getElementById('image-input'); // 获取图片输入框
            const query = inputEl.value.trim();

            if (!query) return;

            chatBox.innerHTML += `<div class="user-msg">你：${query}</div>`;
            inputEl.value = '';
            chatBox.scrollTop = chatBox.scrollHeight;
            sendBtn.disabled = true;

            // 准备请求体
            const requestBody = { query: query };

            // 如果用户选了图片，就转成Base64并加入请求
            if (fileInput.files.length > 0) {
                requestBody.image = await fileToBase64(fileInput.files[0]);
            }

            try {
                const response = await fetch('http://127.0.0.1:8000/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(requestBody)
                });

                const data = await response.json();
                chatBox.innerHTML += `<div class="ai-msg">AI：${data.answer}</div>`;
            } catch (error) {
                chatBox.innerHTML += `<div class="ai-msg" style="color:red;">系统错误：${error.message}</div>`;
            } finally {
                sendBtn.disabled = false;
                chatBox.scrollTop = chatBox.scrollHeight;
            }
        }
    </script>
</body>
</html>
